<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>
        {% block title %}Admin Dashboard{% endblock %}
        - M_SHWARI LOANS
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
            overflow-x: hidden;
        }

        /* =====================================================
           LAYOUT
           ===================================================== */

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            width: 240px;
            min-width: 240px;
            background: #111827;
            color: white;
            padding: 20px 12px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 1000;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
            padding: 10px 15px 25px;
            line-height: 1.3;
        }

        .brand small {
            color: #9ca3af;
            font-size: 10px;
        }

        .nav-link {
            display: block;
            padding: 13px 15px;
            margin-bottom: 5px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: background .2s ease;
        }

        .nav-link:hover {
            background: #1f2937;
            color: white;
        }

        /* =====================================================
           MAIN
           ===================================================== */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            min-width: 0;
        }

        .topbar {
            background: white;
            padding: 18px 30px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .content {
            padding: 25px;
            max-width: 1600px;
        }

        /* =====================================================
           DASHBOARD CARDS
           ===================================================== */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
            min-width: 0;
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .card-value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        /* =====================================================
           SECTIONS
           ===================================================== */

        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
            min-width: 0;
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 20px;
        }

        /* =====================================================
           TABLES
           ===================================================== */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            white-space: nowrap;
        }

        th {
            font-size: 13px;
            color: #6b7280;
            background: #f9fafb;
        }

        td {
            font-size: 14px;
        }

        /* =====================================================
           BADGES
           ===================================================== */

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* =====================================================
           BUTTONS
           ===================================================== */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            border: none;
            border-radius: 7px;
            padding: 9px 14px;
            text-decoration: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 14px;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn:hover {
            opacity: .9;
        }

        /* =====================================================
           SEARCH / FORMS
           ===================================================== */

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            width: auto;
            max-width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1100px) {

            .sidebar {
                width: 210px;
                min-width: 210px;
            }

            .main {
                margin-left: 210px;
                width: calc(100% - 210px);
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .layout {
                display: block;
                min-height: 100vh;
            }

            .sidebar {
                position: sticky;
                top: 0;
                left: 0;
                width: 100%;
                min-width: 100%;
                height: auto;
                padding: 10px;
                overflow: hidden;
            }

            .brand {
                padding: 6px 8px 10px;
                font-size: 18px;
            }

            .brand small {
                font-size: 9px;
            }

            /*
             * Mobile navigation becomes
             * horizontally scrollable.
             */

            .nav-link {
                display: inline-flex;
                align-items: center;
                margin: 0 4px 0 0;
                padding: 10px 12px;
                min-height: 40px;
                white-space: nowrap;
                font-size: 13px;
            }

            .sidebar {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                gap: 4px;
                overflow-x: auto;
            }

            .brand {
                flex: 0 0 auto;
                margin-right: 5px;
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .topbar {
                padding: 14px 15px;
                position: sticky;
                top: 0;
            }

            .content {
                padding: 14px;
                width: 100%;
            }

            /*
             * Two dashboard cards per row
             */

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 14px;
            }

            .card {
                padding: 15px;
                border-radius: 10px;
            }

            .card-title {
                font-size: 12px;
            }

            .card-value {
                font-size: 21px;
            }

            .section {
                padding: 14px;
                margin-bottom: 15px;
                border-radius: 10px;
            }

            .section h2 {
                font-size: 17px;
            }

            /*
             * Tables remain usable by horizontal scrolling.
             */

            .table-wrapper {
                margin-left: -14px;
                margin-right: -14px;
                width: calc(100% + 28px);
            }

            table {
                min-width: 700px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 12px;
            }

            .btn {
                min-height: 42px;
                padding: 10px 14px;
            }

            .search-form {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .search-form input,
            .search-form select,
            .search-form button,
            .search-form .btn {
                width: 100%;
            }

        }

        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 400px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .card-value {
                font-size: 23px;
            }

            .content {
                padding: 10px;
            }

        }

    </style>

    {% block head %}{% endblock %}

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            M_SHWARI
            <br>
            <small>ADMIN DASHBOARD</small>
        </div>

        <a
            class="nav-link"
            href="{{ url_for('admin.dashboard') }}"
        >
            📊 Dashboard
        </a>

        <a
            class="nav-link"
            href="{{ url_for('admin.users') }}"
        >
            👥 Users
        </a>

        <a
            class="nav-link"
            href="{{ url_for('admin.loans') }}"
        >
            💰 Loans
        </a>

        <a
            class="nav-link"
            href="{{ url_for('admin.payments') }}"
        >
            💳 Payments
        </a>

        <a
            class="nav-link"
            href="{{ url_for('admin.settings') }}"
        >
            ⚙️ Settings
        </a>

        <a
            class="nav-link"
            href="{{ url_for('admin.logout') }}"
        >
            🚪 Logout
        </a>

    </aside>


    <main class="main">

        <header class="topbar">

            <strong>
                {% block page_title %}
                Admin Dashboard
                {% endblock %}
            </strong>

        </header>


        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </main>

</div>

</body>

</html>
