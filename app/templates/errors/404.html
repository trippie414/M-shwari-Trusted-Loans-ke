{# errors/404.html #}
{% extends "base.html" %}
{% block title %}Page Not Found | {{ app_name }}{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="card result-card text-center">
    <div class="result-icon neutral" aria-hidden="true"><i class="bi bi-emoji-neutral"></i></div>
    <h1 class="card-title">404 — Page Not Found</h1>
    <p class="card-sub">The page you are looking for does not exist or has expired.</p>
    <a href="{{ url_for('main.landing') }}" class="btn btn-green btn-block">Back to Home</a>
  </div>
</div>
{% endblock %}
