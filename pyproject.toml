[project]
name = "m-shwari-verifiedke"
version = "1.0.0"
description = "M-Shwari loan application portal"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter==4.1.1",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "email-validator==2.3.0",
    "palpluss==0.1.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[tool.vercel]
entrypoint = "run:app"